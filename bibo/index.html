<style>
:root{--bg:#070a1a;--cy:#22e3f0;--vi:#8b5cf6;--ink:#eaf2ff;--mut:#9fb0d0;--navy:#0d1b3d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
.g1{width:340px;height:340px;background:var(--cy);top:-90px;left:-120px;opacity:.28}
.g2{width:380px;height:380px;background:var(--vi);bottom:-120px;right:-140px;opacity:.38;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,227,240,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,227,240,.06) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(ellipse at 50% 60%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 60%,#000 20%,transparent 75%)}
.floaty{position:absolute;font-weight:700;color:rgba(139,92,246,.35);font-family:ui-monospace,monospace;animation:fl 9s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
canvas#fx{position:absolute;inset:0;pointer-events:none}
header.top{position:relative;z-index:3;width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;font-size:13px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
header.top b{color:var(--ink)}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.4s}
.dots i.on{background:var(--cy);box-shadow:0 0 10px var(--cy);width:22px;border-radius:5px}
main{position:relative;z-index:2;flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px}
.bubble{position:relative;min-height:96px;width:100%;max-width:360px;background:rgba(15,22,48,.82);border:1px solid rgba(34,227,240,.35);border-radius:20px;padding:16px 18px;font-size:clamp(18px,5vw,22px);line-height:1.35;font-weight:650;box-shadow:0 0 30px rgba(34,227,240,.15);backdrop-filter:blur(6px);transition:opacity .5s,transform .5s}
.bubble:after{content:"";position:absolute;bottom:-10px;left:50%;width:18px;height:18px;background:inherit;border-right:1px solid rgba(34,227,240,.35);border-bottom:1px solid rgba(34,227,240,.35);transform:translateX(-50%) rotate(45deg)}
.bubble.hide{opacity:0;transform:translateY(10px)}
.bubble .hl{color:var(--cy)}
.caret{display:inline-block;width:2px;height:1em;background:var(--cy);vertical-align:-3px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.robowrap{position:relative;width:min(62vw,250px);margin-top:18px;transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
#robot{width:100%;height:auto;overflow:visible;animation:hover 3.2s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-10px)}}
#head{transform-origin:120px 150px;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.s1 #head{transform:rotate(-12deg)}
.s3 #head{transform:rotate(4deg)}
.eye{transition:all .4s}
.s1 .eyes{animation:wob 1.4s ease-in-out infinite}
@keyframes wob{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mouth{opacity:0;transition:opacity .3s}
.s1 #m-conf,.s2 #m-o,.s3 #m-smile,.s4 #m-smile{opacity:1}
.qm{opacity:0;font:800 34px system-ui;fill:var(--vi)}
.s1 .qm{animation:qm 2.2s ease-in-out infinite}
.s1 .qm.b{animation-delay:.7s;fill:var(--cy)}
@keyframes qm{0%{opacity:0;transform:translateY(10px)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
#bulb{opacity:0;transform-origin:120px 20px;transition:.5s}
.s2 #bulb{opacity:1;animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}}
.s2 #ant-tip,.s3 #ant-tip{fill:#fde047;filter:drop-shadow(0 0 8px #fde047)}
#ant-tip{fill:var(--cy);transition:.4s}
#armR{transform-origin:186px 205px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.s3 #armR,.s4 #armR{transform:rotate(-115deg)}
#thumb{opacity:0;transition:.4s .3s}
.s3 #thumb,.s4 #thumb{opacity:1}
#armL{transform-origin:54px 205px;transition:.7s}
.s1 #armL{transform:rotate(40deg)}
.blink{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eyes{transform-origin:120px 118px}
.s2 .robowrap{transform:scale(.62) translateY(-30px)}
/* web interface */
.web{position:absolute;left:50%;bottom:6%;width:min(88vw,380px);transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .4s}
.s2 .web{opacity:1}
.web .frame{border-radius:14px;background:#0e1430;border:1px solid rgba(139,92,246,.5);box-shadow:0 0 40px rgba(139,92,246,.35),0 0 0 1px rgba(34,227,240,.15) inset;overflow:hidden;transform:scale(.6) rotateX(40deg);opacity:0}
.s2 .web .frame{animation:in-frame .9s .3s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes in-frame{to{transform:none;opacity:1}}
.bar{display:flex;gap:6px;align-items:center;padding:9px 11px;background:#151d42}
.bar i{width:9px;height:9px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.bar span{flex:1;margin-left:8px;height:16px;border-radius:8px;background:rgba(255,255,255,.08);font:11px ui-monospace,monospace;color:var(--mut);padding:1px 8px;white-space:nowrap;overflow:hidden}
.pg{padding:12px}
.pg>*{opacity:0;transform:translateY(16px)}
.s2 .pg>*{animation:up .6s cubic-bezier(.2,1.3,.4,1) forwards}
.s2 .pg .nav{animation-delay:1.1s}.s2 .pg .hero{animation-delay:1.6s}.s2 .pg .cards{animation-delay:2.2s}
@keyframes up{to{opacity:1;transform:none}}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav b{width:56px;height:10px;border-radius:5px;background:var(--cy)}
.nav span{display:flex;gap:6px}.nav span i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.hero{border-radius:10px;padding:14px;background:linear-gradient(120deg,rgba(34,227,240,.25),rgba(139,92,246,.35));margin-bottom:10px}
.hero p{font:800 15px system-ui;margin-bottom:8px}
.hero em{display:inline-block;font:700 11px system-ui;font-style:normal;background:var(--cy);color:#04121a;border-radius:20px;padding:5px 10px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.cards div{height:52px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);position:relative}
.cards div:before{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:5px;background:var(--vi)}
.cards div:nth-child(2):before{background:var(--cy)}.cards div:nth-child(3):before{background:#fde047}
.cards div:after{content:"";position:absolute;left:8px;bottom:9px;width:60%;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
/* end card */
.end{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .7s}
.s4 .end{opacity:1;pointer-events:auto}
.s4 main{opacity:.0;transition:opacity .5s}
.logo{width:96px;height:96px;border-radius:24px;background:#fff;box-shadow:0 0 40px rgba(34,227,240,.4);overflow:hidden;margin-bottom:18px}
.logo img{width:100%;height:100%;object-fit:cover}
.word{font-size:clamp(30px,9vw,44px);font-weight:850;letter-spacing:-.02em;line-height:1}
.word span{background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mut);margin:12px 0 26px;font-size:16px;max-width:320px;line-height:1.45}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--cy);color:#03141c;font-weight:800;font-size:17px;padding:15px 26px;border-radius:999px;text-decoration:none;box-shadow:0 8px 30px rgba(34,227,240,.4);transition:transform .2s}
.cta:hover,.cta:focus-visible{transform:translateY(-2px)}
.sec{margin-top:16px;color:var(--ink);font-size:15px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--vi)}
.foot{color:var(--mut);font-size:12px;margin-top:22px}
/* controls */
nav.ctrl{position:relative;z-index:5;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));width:100%;max-width:520px;justify-content:center}
nav.ctrl button{flex:1;max-width:150px;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(20,28,60,.75);color:var(--ink);font:650 15px system-ui;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;backdrop-filter:blur(6px);transition:background .2s,border-color .2s}
nav.ctrl button:hover{border-color:var(--cy)}
nav.ctrl button:focus-visible,.cta:focus-visible,.sec:focus-visible,a.saltar:focus-visible{outline:3px solid #fde047;outline-offset:3px}
a.saltar{position:fixed;z-index:9;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid #22e3f0;border-radius:999px;background:#0d1b3d;color:#eaf2ff;font:700 14px/1 system-ui,sans-serif;text-decoration:none}
@media(max-width:560px){header.top{padding-right:96px}}
nav.ctrl button#next{background:linear-gradient(135deg,rgba(34,227,240,.3),rgba(139,92,246,.4));border-color:rgba(34,227,240,.5)}
nav.ctrl button[aria-pressed="true"]{border-color:var(--cy);color:var(--cy)}
nav.ctrl button:disabled{opacity:.4;cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-height:760px){.robowrap{width:min(66vw,280px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
try{sessionStorage.setItem('bibo_intro_seen','1')}catch(e){}
(()=>{
const st=document.getElementById('stage'),say=document.getElementById('say'),bub=document.getElementById('bubble'),
dots=[...document.querySelectorAll('.dots i')],nextB=document.getElementById('next'),snd=document.getElementById('snd'),live=document.getElementById('live');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LINES={1:'Ainda achas que a tecnologia é um <span class="hl">bicho de sete cabeças</span>?',2:'Espera… tive uma ideia! 💡',3:'Tu tratas do teu negócio. <span class="hl">Nós ajudamos-te com a tecnologia.</span>'};
const DUR={1:7000,2:6500,3:6500};
let scene=0,timers=[],ac=null,on=false;
function clear(){timers.forEach(clearTimeout);timers=[]}
function T(f,ms){timers.push(setTimeout(f,ms))}
// audio
function tone(f,d,type='sine',v=.05,slide){if(!on||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
function whoosh(){if(!on||!ac)return;const n=ac.sampleRate*.8,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.setValueAtTime(300,ac.currentTime);f.frequency.exponentialRampToValueAtTime(3000,ac.currentTime+.8);g.gain.value=.12;s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start()}
function chime(){[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.6,'triangle',.06),i*110))}
snd.onclick=()=>{on=!on;if(on&&!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}if(ac&&ac.state==='suspended')ac.resume();
 snd.setAttribute('aria-pressed',on);snd.setAttribute('aria-label',on?'Desativar som':'Ativar som');snd.textContent=on?'🔊 Som':'🔇 Som';if(on)tone(880,.12,'sine',.05)};
// typewriter
function type(html){say.innerHTML='';bub.classList.remove('hide');const tmp=document.createElement('div');tmp.innerHTML=html;live.textContent=tmp.textContent;
 if(RM){say.innerHTML=html;return}
 const nodes=[...tmp.childNodes];let ni=0,ci=0,cur=null;
 (function step(){if(ni>=nodes.length)return;const n=nodes[ni];
  if(n.nodeType===3){if(!cur){cur=document.createTextNode('');say.appendChild(cur)}cur.data+=n.data[ci];ci++;if(ci>=n.data.length){ni++;ci=0;cur=null}}
  else{if(!cur){cur=n.cloneNode(false);say.appendChild(cur)}cur.textContent+=n.textContent[ci];ci++;if(ci>=n.textContent.length){ni++;ci=0;cur=null}}
  if(ci%2===0)tone(1200+Math.random()*500,.03,'square',.015);T(step,38)})()}
// particles
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}rs();addEventListener('resize',rs);
function burst(){if(RM)return;const r=document.querySelector('.robowrap').getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.25;
 for(let i=0;i<90;i++){const a=Math.random()*6.28,s=2+Math.random()*6;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:Math.random()<.5?'34,227,240':'139,92,246',r:1+Math.random()*3})}}
(function loop(){cx.clearRect(0,0,innerWidth,innerHeight);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy=p.vy*.97+.03;p.l-=.012;cx.beginPath();cx.fillStyle=`rgba(${p.c},${p.l})`;cx.shadowBlur=12;cx.shadowColor=`rgb(${p.c})`;cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}requestAnimationFrame(loop)})();
function go(n){clear();scene=n;st.className='s'+n;dots.forEach((d,i)=>d.classList.toggle('on',i===n-1));
 nextB.disabled=n===4;
 if(n<4){T(()=>type(LINES[n]),n===1?600:400)}
 if(n===2){T(()=>{burst();whoosh();chime()},250);bub.classList.add('hide')}
 if(n===3)T(()=>tone(523,.25,'triangle',.05),300);
 if(n===4){live.textContent='Gomes IA Digital. Fala connosco pelo WhatsApp.';chime();T(()=>document.querySelector('.cta').focus({preventScroll:true}),800)}
 if(n<4)T(()=>go(n+1),DUR[n])}
nextB.onclick=()=>{if(scene<4)go(scene+1)};
document.getElementById('replay').onclick=()=>{P=[];go(1)};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='A')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextB.click()}else if(e.key==='r'||e.key==='R')go(1)});
window.__go=go;go(1);
})();
</script>
